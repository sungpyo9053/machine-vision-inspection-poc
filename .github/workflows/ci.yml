name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: build (Ubuntu) — cmake + ctest + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (cmake, OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libopencv-dev pkg-config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sample images (needed by pytest)
        run: python scripts/generate_sample_images.py

      - name: Configure C++ build (GoogleTest on)
        run: cmake -S cpp -B build -DVISION_INSPECTOR_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build vision_inspector + tests
        run: cmake --build build -j

      - name: Run C++ unit tests (GoogleTest via ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Run Python tests (now incl. CLI integration)
        run: pytest -v

      - name: Smoke run — inspect each sample
        run: |
          for img in normal_surface scratch_surface dot_defect_surface stain_surface mixed_defects_surface; do
            ./build/vision_inspector \
              --image "data/sample_images/${img}.png" \
              --output data/results
          done

      - name: Benchmark (5 images × 20 runs)
        run: |
          python scripts/benchmark_inspector.py \
            --images data/sample_images --runs 20
          echo '---'
          cat data/benchmark_runs/benchmark.md

      - name: Dataset evaluation (synthetic, 40 images)
        run: |
          python scripts/generate_eval_dataset.py --out data/eval --count 40 --seed 7
          python scripts/evaluate_dataset.py --dataset data/eval --out data/eval_runs
          echo '---'
          cat data/eval_runs/summary.json

      - name: Upload benchmark + eval artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspector-reports
          path: |
            data/results/*.json
            data/results/*.png
            data/benchmark_runs/*
            data/eval_runs/*
          if-no-files-found: warn
