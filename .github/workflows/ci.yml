name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: build + ctest + pytest (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate sample images
        run: python scripts/generate_sample_images.py

      - name: Install cmake / g++ / OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev

      - name: Configure CMake (with GoogleTest)
        run: cmake -S cpp -B build -DVISION_INSPECTOR_BUILD_TESTS=ON

      - name: Build vision_inspector + tests
        run: cmake --build build

      - name: Smoke run vision_inspector
        run: ./build/vision_inspector --image data/sample_images/scratch_surface.png --output data/results

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run Python tests
        run: pytest -v
